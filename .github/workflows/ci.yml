name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Throwaway Postgres so migrations are applied against a real database in CI
    # (P3-10). drizzle-kit's migrate driver is standard pg - unlike the app's
    # neon-http runtime client - so it connects to this service directly.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Build-time placeholders. Real secrets live in Vercel.
      # These exist only so `next build` and unit tests don't fail at module-load.
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-only-not-a-real-secret-ci-only-not-a-real-secret
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      EMAIL_FROM: ci@example.com
      RESEND_API_KEY: re_ci_dummy
      RESEND_WEBHOOK_SECRET: whsec_ci_dummy
      STRIPE_SECRET_KEY: sk_test_ci_dummy
      STRIPE_WEBHOOK_SECRET: whsec_ci_dummy
      CRON_SECRET: ci-cron-secret
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate environment schema
        # P3-10: zod parser over the required env vars in "check mode". Catches a
        # missing/malformed required variable before build. Standalone script -
        # not imported by the app runtime.
        run: npm run env:check

      - name: Verify migrations are in sync
        # Catches schema/migration drift before merge: errors out if a
        # generated SQL file is missing or two migrations conflict. Doesn't
        # touch a real database.
        run: npm run db:check

      - name: Apply migrations to a throwaway Postgres
        # P3-10: proves every migration applies cleanly from scratch against a
        # real Postgres (the `services.postgres` container above), not just a
        # static drizzle diff. Production migrations run from `vercel-build`
        # against the prod DATABASE_URL on deploy.
        run: npm run db:migrate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Bundle-size budget
        run: npm run bundle:budget

      - name: Dependency vulnerability audit
        # Non-blocking - flags new high/critical CVEs in dependencies but doesn't
        # fail the build (an indirect transitive vuln we can't fix shouldn't block
        # unrelated PRs). Track findings in GitHub Security tab and triage weekly.
        run: npm audit --audit-level=high || true
